{{ define "main" }}
    <h1>{{ .Title }}</h1>
    {{ .Content }}
    {{ if .Pages }}
    <h2>Related Articles</h2>
    <ul>
        {{ range .Pages }}
        <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
        {{ end }}
    </ul>
    {{ end }}
    <div class="terminal-nav">
      {{ partial "menu.html" (dict "menuID" "main" "page" .) }}
    </div>
{{ end }}
